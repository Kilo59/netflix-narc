name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build Standalone Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: netflix-narc-aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary_name: netflix-narc-x86_64-apple-darwin

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: netflix-narc-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: netflix-narc-x86_64-pc-windows-msvc.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Clean dist directory
        shell: bash
        run: rm -rf dist && mkdir -p dist

      - name: Build Wheel
        run: uv build --wheel

      - name: Build Standalone Executable via PyApp
        shell: bash
        env:
          PYAPP_PROJECT_NAME: "netflix-narc"
          PYAPP_EXEC_SPEC: "netflix_narc.main:main"
          PYAPP_PYTHON_VERSION: "3.13"
          PYAPP_EMBED: "1"
        run: |
          WHEEL_PATH=$(ls -t dist/*.whl | head -n 1)
          PYAPP_WHEEL_FILE="$(pwd)/$WHEEL_PATH" cargo install pyapp --root dist/bin
          if [ -f "dist/bin/bin/pyapp.exe" ]; then
            cp "dist/bin/bin/pyapp.exe" "dist/${{ matrix.binary_name }}"
          else
            cp "dist/bin/bin/pyapp" "dist/${{ matrix.binary_name }}"
          fi
          chmod +x "dist/${{ matrix.binary_name }}" || true





          mkdir -p dist/pkg
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "dist/${{ matrix.binary_name }}" "dist/pkg/netflix-narc.exe"
            (cd dist/pkg && zip "../${{ matrix.binary_name }}.zip" netflix-narc.exe)
          else
            cp "dist/${{ matrix.binary_name }}" "dist/pkg/netflix-narc"
            chmod +x "dist/pkg/netflix-narc"
            tar -czf "dist/${{ matrix.binary_name }}.tar.gz" -C dist/pkg netflix-narc
          fi
          rm -rf dist/pkg

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/${{ matrix.binary_name }}
            dist/${{ matrix.binary_name }}.tar.gz
            dist/${{ matrix.binary_name }}.zip

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # This permission is required for trusted publishing
      id-token: write
      # This permission is required to read the repository content
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Publish package
        run: |
          # Capture stderr to a file so we can check for specific error strings
          uv publish 2> publish_err.log || {
            exit_code=$?
            # Check for common "version already exists" markers in the output
            if grep -qi "already exists" publish_err.log; then
              echo "::warning title=Netflix Narc Publish::Version already exists on PyPI. Skipping upload."
            else
              cat publish_err.log
              exit $exit_code
            fi
          }

  github-release:
    name: Create GitHub Release
    needs: [publish, build-binaries]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Download Binary Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
